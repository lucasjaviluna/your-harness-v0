name: Validate package

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.19.0, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Report runtime compatibility
        run: |
          node --version
          npm --version
          npm ls @earendil-works/pi-coding-agent --depth=0
      - run: npm test
      - name: Require clean-consumer smoke test
        shell: bash
        run: |
          npm_cache="$(npm config get cache)"
          PI_HARNESS_E2E_NPM_CACHE="$npm_cache" npm run test:e2e:required
      - run: npm run pack:check
